<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Financeiro ao Vivo</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --text:#14171c; --muted:#5b6470; --line:#e2e5ea;
  --accent:#0f5fd7; --accent-soft:#e6efff;
  --up:#0a7d43; --up-bg:#e1f4ea; --down:#c62828; --down-bg:#fdeaea; --flat:#5b6470; --flat-bg:#eceff2;
  --warn-bg:#fff6df; --warn-text:#6b4e00; --warn-line:#f0dda0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --surface:#171b22; --text:#e8ebf0; --muted:#9aa4b2; --line:#262c36;
    --accent:#6ea8ff; --accent-soft:#1c2a44;
    --up:#47d18a; --up-bg:#123222; --down:#ff7b7b; --down-bg:#3a1a1a; --flat:#9aa4b2; --flat-bg:#222831;
    --warn-bg:#2b2410; --warn-text:#f0d58a; --warn-line:#4a3d16;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --surface:#171b22; --text:#e8ebf0; --muted:#9aa4b2; --line:#262c36;
  --accent:#6ea8ff; --accent-soft:#1c2a44;
  --up:#47d18a; --up-bg:#123222; --down:#ff7b7b; --down-bg:#3a1a1a; --flat:#9aa4b2; --flat-bg:#222831;
  --warn-bg:#2b2410; --warn-text:#f0d58a; --warn-line:#4a3d16;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:0 16px 56px}
header{padding:20px 0 6px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:1.4rem;line-height:1.25;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.85rem;margin:0}
.status{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);margin:6px 0 2px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--flat);flex:0 0 auto}
.dot.ok{background:var(--up);animation:pulse 2s infinite}
.dot.err{background:var(--down)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(10,125,67,.45)}70%{box-shadow:0 0 0 7px rgba(10,125,67,0)}100%{box-shadow:0 0 0 0 rgba(10,125,67,0)}}
@media (prefers-reduced-motion: reduce){.dot.ok{animation:none}}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:.8rem;font-weight:600;padding:5px 10px;border-radius:99px;cursor:pointer}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:8px;padding:10px 0;background:var(--bg);border-bottom:1px solid var(--line)}
.tab{flex:1;appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-weight:600;font-size:.95rem;padding:10px 12px;border-radius:12px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tab:focus-visible,.chip:focus-visible,input:focus-visible,a:focus-visible,.iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools{margin:14px 0 4px}
.search{width:100%;font:inherit;font-size:.95rem;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:.8rem;font-weight:600;padding:6px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.count{color:var(--muted);font-size:.8rem;margin:8px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.75rem;color:var(--muted)}
.tag{background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:99px;font-weight:700}
.title{font-size:1rem;line-height:1.35;margin:8px 0 4px;font-weight:700}
.text{margin:0 0 8px;color:var(--muted);font-size:.9rem}
.src{font-size:.8rem;font-weight:600;color:var(--accent);text-decoration:none}
.src:hover{text-decoration:underline}
.empty{color:var(--muted);text-align:center;padding:32px 8px}
.err{background:var(--down-bg);color:var(--down);border-radius:12px;padding:10px 12px;font-size:.85rem;margin:12px 0}
.group{margin:22px 0 0}
.group h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.tile .n{font-size:.78rem;color:var(--muted);font-weight:600}
.tile .v{font-size:1.25rem;font-weight:750;letter-spacing:-.01em;margin:2px 0;overflow-wrap:anywhere}
.tile .u{font-size:.75rem;color:var(--muted);font-weight:600;margin-left:3px}
.delta{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px}
.delta.up{color:var(--up);background:var(--up-bg)}
.delta.down{color:var(--down);background:var(--down-bg)}
.delta.flat{color:var(--flat);background:var(--flat-bg)}
.tile .note{font-size:.72rem;color:var(--muted);margin-top:6px;line-height:1.35}
.skel{height:78px;border-radius:14px;background:var(--line);opacity:.5}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:320px}
th,td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em}
tr:last-child td{border-bottom:0}
footer{margin-top:28px;color:var(--muted);font-size:.75rem;line-height:1.5}
footer p{margin:0 0 8px}
[hidden]{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Painel Financeiro ao Vivo</h1>
      <p class="sub" id="dateline"></p>
      <div class="status"><span class="dot" id="dot"></span><span id="statustext">Conectando…</span></div>
    </div>
    <button class="iconbtn" id="refresh" type="button" aria-label="Atualizar agora">↻ Atualizar</button>
  </header>

  <div class="tabs" role="tablist" aria-label="Seções">
    <button class="tab" role="tab" id="tab-news" aria-controls="panel-news" aria-selected="true">Notícias</button>
    <button class="tab" role="tab" id="tab-ind" aria-controls="panel-ind" aria-selected="false">Indicadores</button>
  </div>

  <section id="panel-news" role="tabpanel" aria-labelledby="tab-news">
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="Buscar nas notícias…" aria-label="Buscar nas notícias" autocomplete="off">
      <div class="chips" id="chips" role="group" aria-label="Filtros"></div>
      <p class="count" id="count"></p>
    </div>
    <div id="newserr"></div>
    <div id="news"><div class="skel"></div></div>
  </section>

  <section id="panel-ind" role="tabpanel" aria-labelledby="tab-ind" hidden>
    <div id="inderr"></div>
    <div id="ind"><div class="group"><div class="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></div></div>
  </section>

  <footer id="footer"></footer>
</div>

<script>
'use strict';
const TZ = 'America/Sao_Paulo';
const IND_EVERY_MS = 30 * 1000;
const NEWS_EVERY_MS = 4 * 60 * 1000;

const $ = (s) => document.querySelector(s);
function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const fmtTime = (ms) => new Date(ms).toLocaleTimeString('pt-BR', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
const fmtTimeS = (ms) => new Date(ms).toLocaleTimeString('pt-BR', { timeZone: TZ, hour: '2-digit', minute: '2-digit', second: '2-digit' });
const dayKey = (ms) => new Date(ms).toLocaleDateString('sv-SE', { timeZone: TZ });
const fmtDM = (ms) => new Date(ms).toLocaleDateString('pt-BR', { timeZone: TZ, day: '2-digit', month: '2-digit' });

function whenLabel(ms){
  if (!ms) return '';
  const k = dayKey(ms);
  if (k === dayKey(Date.now())) return 'Hoje · ' + fmtTime(ms);
  if (k === dayKey(Date.now() - 864e5)) return 'Ontem · ' + fmtTime(ms);
  return fmtDM(ms) + ' · ' + fmtTime(ms);
}
function quoteTime(ms){
  return dayKey(ms) === dayKey(Date.now()) ? 'às ' + fmtTime(ms) : fmtDM(ms) + ' ' + fmtTime(ms);
}

$('#dateline').textContent = (() => {
  const s = new Date().toLocaleDateString('pt-BR', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  return s.charAt(0).toUpperCase() + s.slice(1);
})();

const state = { news: null, ind: null, cat: 'Todas', onlyToday: false, q: '', lastInd: 0, lastNews: 0 };

async function api(path){
  const r = await fetch(path, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function setStatus(ok, text){
  $('#dot').className = 'dot ' + (ok ? 'ok' : 'err');
  $('#statustext').textContent = text;
}

/* ---------------- Notícias ---------------- */
function buildChips(){
  const box = $('#chips');
  box.textContent = '';
  const items = state.news ? state.news.items : [];
  const cats = ['Todas', ...Array.from(new Set(items.map((n) => n.cat))).sort((a, b) => a.localeCompare(b, 'pt-BR'))];

  const today = el('button', 'chip', 'Só hoje');
  today.type = 'button';
  today.setAttribute('aria-pressed', String(state.onlyToday));
  today.addEventListener('click', () => { state.onlyToday = !state.onlyToday; buildChips(); renderNews(); });
  box.appendChild(today);

  cats.forEach((c) => {
    const b = el('button', 'chip', c);
    b.type = 'button';
    b.setAttribute('aria-pressed', String(c === state.cat));
    b.addEventListener('click', () => { state.cat = c; buildChips(); renderNews(); });
    box.appendChild(b);
  });
}

function renderNews(){
  const list = $('#news');
  list.textContent = '';
  if (!state.news){ return; }
  const nq = norm(state.q.trim());
  const todayKey = dayKey(Date.now());
  const items = state.news.items
    .filter((n) => state.cat === 'Todas' || n.cat === state.cat)
    .filter((n) => !state.onlyToday || (n.ts && dayKey(n.ts) === todayKey))
    .filter((n) => !nq || norm(n.title + ' ' + n.summary + ' ' + n.source).includes(nq));

  $('#count').textContent = items.length + (items.length === 1 ? ' notícia' : ' notícias');
  if (!items.length){
    list.appendChild(el('p', 'empty', 'Nenhuma notícia encontrada para esse filtro.'));
    return;
  }
  items.forEach((n) => {
    const card = el('article', 'card');
    const meta = el('div', 'meta');
    meta.appendChild(el('span', 'tag', n.cat));
    if (n.ts) meta.appendChild(el('span', '', whenLabel(n.ts)));
    card.appendChild(meta);
    card.appendChild(el('h3', 'title', n.title));
    if (n.summary) card.appendChild(el('p', 'text', n.summary));
    if (/^https?:\/\//i.test(n.link)){
      const a = el('a', 'src', 'Ler em ' + n.source + ' ↗');
      a.href = n.link; a.target = '_blank'; a.rel = 'noopener noreferrer';
      card.appendChild(a);
    }
    list.appendChild(card);
  });
}

async function loadNews(){
  try {
    state.news = await api('/api/news');
    state.lastNews = Date.now();
    $('#newserr').textContent = '';
    if (!state.news.items.length){
      $('#newserr').appendChild(el('div', 'err', 'Nenhum feed de notícias respondeu agora. Veja o rodapé para detalhes.'));
    }
    buildChips();
    renderNews();
    renderFooter();
  } catch (e) {
    $('#newserr').textContent = '';
    $('#newserr').appendChild(el('div', 'err', 'Não foi possível carregar as notícias (' + e.message + ').'));
  }
}

/* ---------------- Indicadores ---------------- */
function renderInd(){
  const root = $('#ind');
  root.textContent = '';
  const d = state.ind;
  if (!d) return;

  d.groups.forEach((g) => {
    const sec = el('div', 'group');
    sec.appendChild(el('h2', '', g.title));
    const grid = el('div', 'grid');
    g.items.forEach((i) => {
      const t = el('div', 'tile');
      t.appendChild(el('div', 'n', i.name));
      const v = el('div', 'v', i.value);
      if (i.unit) v.appendChild(el('span', 'u', i.unit));
      t.appendChild(v);
      if (i.delta) t.appendChild(el('span', 'delta ' + (i.tone || 'flat'), i.delta));
      const note = [i.note, i.t ? 'cotação ' + quoteTime(i.t) : ''].filter(Boolean).join(' · ');
      if (note) t.appendChild(el('div', 'note', note));
      grid.appendChild(t);
    });
    sec.appendChild(grid);
    root.appendChild(sec);
  });

  if (d.focus){
    const fsec = el('div', 'group');
    fsec.appendChild(el('h2', '', 'Expectativas de mercado — ' + d.focus.ref));
    const wrap = el('div', 'tablewrap');
    const table = el('table');
    const thead = el('thead');
    const hr = el('tr');
    hr.appendChild(el('th', '', 'Indicador'));
    d.focus.cols.forEach((c) => hr.appendChild(el('th', '', c)));
    thead.appendChild(hr);
    table.appendChild(thead);
    const tbody = el('tbody');
    d.focus.rows.forEach((r) => {
      const tr = el('tr');
      r.forEach((c) => tr.appendChild(el('td', '', c)));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    fsec.appendChild(wrap);
    root.appendChild(fsec);
  }
}

async function loadInd(){
  try {
    state.ind = await api('/api/indicators');
    state.lastInd = Date.now();
    setStatus(true, 'Ao vivo · atualizado às ' + fmtTimeS(state.lastInd));
    $('#inderr').textContent = '';
    if (!state.ind.groups.length){
      $('#inderr').appendChild(el('div', 'err', 'Nenhuma fonte de cotações respondeu agora. Tente atualizar em instantes.'));
    }
    renderInd();
    renderFooter();
  } catch (e) {
    setStatus(false, 'Sem conexão com o servidor (' + e.message + ')');
  }
}

/* ---------------- Rodapé ---------------- */
function renderFooter(){
  const f = $('#footer');
  f.textContent = '';
  const p1 = el('p', '', 'Conteúdo informativo, sem caráter de recomendação de investimento. Cotações vêm de fontes públicas e podem ter atraso de alguns minutos; séries oficiais (Selic, IPCA, PNAD etc.) vêm do Banco Central e só mudam quando há nova divulgação. Notícias mostram apenas título e trecho inicial: abra o link para a matéria completa.');
  f.appendChild(p1);
  const fails = [];
  if (state.ind && state.ind.errors) state.ind.errors.forEach((e) => fails.push(e.id));
  if (state.news && state.news.sources) state.news.sources.filter((s) => !s.ok).forEach((s) => fails.push(s.name));
  if (fails.length) f.appendChild(el('p', '', 'Fontes indisponíveis agora: ' + fails.join(', ') + '.'));
  if (state.news && state.news.sources){
    const okc = state.news.sources.filter((s) => s.ok).map((s) => s.name);
    if (okc.length) f.appendChild(el('p', '', 'Notícias de: ' + okc.join(', ') + '.'));
  }
}

/* ---------------- Abas e eventos ---------------- */
const tabs = { news: $('#tab-news'), ind: $('#tab-ind') };
const panels = { news: $('#panel-news'), ind: $('#panel-ind') };
function showTab(name){
  Object.keys(tabs).forEach((k) => {
    const on = k === name;
    tabs[k].setAttribute('aria-selected', String(on));
    panels[k].hidden = !on;
  });
  try { localStorage.setItem('painel-tab', name); } catch (e) {}
  window.scrollTo({ top: 0 });
}
tabs.news.addEventListener('click', () => showTab('news'));
tabs.ind.addEventListener('click', () => showTab('ind'));
$('#q').addEventListener('input', (e) => { state.q = e.target.value; renderNews(); });
$('#refresh').addEventListener('click', () => { loadInd(); loadNews(); });

setInterval(() => { if (!document.hidden) loadInd(); }, IND_EVERY_MS);
setInterval(() => { if (!document.hidden) loadNews(); }, NEWS_EVERY_MS);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (Date.now() - state.lastInd > 15000) loadInd();
  if (Date.now() - state.lastNews > 60000) loadNews();
});

buildChips();
try { if (localStorage.getItem('painel-tab') === 'ind') showTab('ind'); } catch (e) {}
loadInd();
loadNews();
</script>
</body>
</html>
